[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Estos valores no son secretos (servidor SMTP público de Gmail, puerto y nombre
  # visible del Club) y aparecen a propósito en la documentación y en la web.
  # SMTP_USER y SMTP_PASS siguen protegidos por el escaneo de secretos.
  SECRETS_SCAN_OMIT_KEYS = "SMTP_HOST,SMTP_PORT,MAIL_FROM_NAME"

[functions]
  node_bundler = "esbuild"

# Desarrollo local con `netlify dev` (web + funciones en http://localhost:8888)
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# La web es una aplicación de una sola página: todas las rutas cargan index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
