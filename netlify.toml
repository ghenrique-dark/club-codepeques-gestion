[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Desarrollo local con `netlify dev` (web + funciones en http://localhost:8888)
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# La web es una aplicación de una sola página: todas las rutas cargan index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
